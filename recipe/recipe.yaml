context:
  version: "0.14.12"

package:
  name: procs
  version: ${{ version }}

source:
  url: https://github.com/dalance/procs/archive/v${{ version }}.tar.gz
  sha256: f2fab583fe98a9ae9505c5eecf4f3d9d4ad9bcb5d478a8222d52c87aa1ac602e

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - procs --help

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Modern replacement for ps written by Rust
  homepage: https://github.com/dalance/procs
  repository: https://github.com/dalance/procs

extra:
  recipe-maintainers:
    - danielnachun
